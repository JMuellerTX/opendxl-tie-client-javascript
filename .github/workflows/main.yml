name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron:  '0 0 * * *'

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
      fail-fast: false
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: |
        npm install
        # The published @opendxl/dxl-client 0.1.4 pulls mqtt 2.x and with it the ws advisories.
        # Replace it with the fork's release tarball: --no-save leaves package.json alone, and
        # +fork.1 is semver build metadata, so it still satisfies the declared range.
        npm install --no-save "https://github.com/JMuellerTX/opendxl-client-javascript/releases/download/v0.1.4%2Bfork.1/opendxl-dxl-client-0.1.4%2Bfork.1.tgz"
        
    - name: Execute CI
      run: |
        npm run ci
